name: Update passkeys lock

on:
  push:
    branches: [codex/add-passkeys]
    paths:
      - composer.json
      - .github/workflows/update-passkeys-lock.yml

permissions:
  contents: read

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          tools: composer:v2
      - run: composer update laravel/passkeys --with-all-dependencies --no-interaction --prefer-dist
      - uses: actions/upload-artifact@v4
        with:
          name: passkeys-composer-lock
          path: composer.lock
