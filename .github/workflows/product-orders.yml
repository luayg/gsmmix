name: Product order integrity (MariaDB)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: product-orders-${{ github.ref }}
  cancel-in-progress: true
jobs:
  product-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: disposable-root-only
          MARIADB_DATABASE: gsmmix_product_test
          MARIADB_USER: gsmmix_test
          MARIADB_PASSWORD: synthetic-test-only
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: mbstring, xml, dom, curl, bcmath, pdo_mysql, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan key:generate --force
      - name: Test migrations, billing, stock and concurrent submissions with synthetic data
        env:
          PRODUCT_ORDERS_TEST_MYSQL: '1'
          PRODUCT_ORDERS_TEST_DATABASE: gsmmix_product_test
          PRODUCT_ORDERS_TEST_PORT: ${{ job.services.mariadb.ports[3306] }}
        run: vendor/bin/phpunit tests/Feature/ProductOrderWorkflowTest.php --testdox
